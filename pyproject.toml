[project]
name = "maniprot"
version = "0.1.0"
description = "Riemannian geometry tools for protein conformation analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "numba",
    "mdtraj",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["maniprot.core*"]